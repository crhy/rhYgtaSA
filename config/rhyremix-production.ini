; rhYgtaSA production lighting profile.
;
; This is the profile deploy.sh installs. It is not a bisect ladder: every
; module is on, at the values the physics and the measurements support. The
; bisect ladder lives in rhyremix-test.ini and scripts/abtest-lights.sh walks
; down it when something is broken.
;
; ---------------------------------------------------------------------------
; UNITS, once more because it has cost days
;   rtx.conf sets rtx.sceneScale = 0.01, so 1 GTA SA game unit = 1 cm in the
;   Remix world. The lamp lists are in game units and stay in game units all the
;   way into CreateLight: a light at game-unit (2489, -1655, 19) lands on the
;   lamp post at (2489, -1655, 19). Verified by measurement, not by reading the
;   docs - see docs/FINDINGS.md, "the lamps were never the failing ones".
;
; ---------------------------------------------------------------------------
; WHAT IS LIGHTING THE SCENE, and who owns what
;   the sun        [sun]  one Remix distant light, direction from real solar
;                         geometry (latitude + season + clock), brightness and
;                         colour from Beer-Lambert extinction through the air
;   the moon       [moon] one Remix distant light, opposite the sun by the
;                         lunar phase, dimmed by the same atmosphere
;   the sky        [sky]  rtx.skyBrightness and rtx.emissiveIntensity, pushed at
;                         runtime so night is actually dark. This is the part
;                         rtx.conf cannot do on its own: a constant
;                         skyBrightness = 3 lights a midnight street exactly
;                         like noon, and no amount of lamp tuning fixes that.
;   the exposure   [tonemap] rtx.tonemap.exposureBias, pushed at runtime off the
;                         same sun elevation. Same reason: with Global tonemapping
;                         (n16) the exposure of the whole frame is one number, and
;                         a number in rtx.conf cannot be -0.5 at noon and +0.5 at
;                         21:00.
;   street lamps   [streetlights] point lights from the generated lamp list,
;                         switched by solar twilight instead of by the clock
;   traffic lights [trafficlights] point lights from the generated signal list
;   the asset pack the GTASA-Remix USD materials' own emissives and light prims
;                         - not ours, tuned through rtx.conf / [sky]
;
; The game's own directional lights are suppressed by
; rtx.ignoreGameDirectionalLights = True, and the two Lua mods that used to do
; this job (SARemiv_LightMan.lua, SARemix_Sun.lua) are disabled by deploy.sh
; whenever the matching section here is enabled. Two suns and two sets of lamps
; is the "everything is blown out" look.

[streetlights]
enabled=1
list=rhyremix_lights.txt

; Selection radii, in game units. Measured over the WHOLE 7002-lamp list (not one
; street): the number of lamps within 300 units of a lamp is 149 at the median,
; 408 at the worst point on the map; within 380 units it is 234 / 552. The plugin
; prints the worst case it can find at load (`streetlights: worst case N lamps
; within max_distance=...`) so this number is checkable in rhyremix.log.
max_distance=300
; exit_distance is the anti-flicker half: a lamp that already has a light keeps
; it out to here, so a lamp sitting on the max_distance boundary is not created
; at one re-selection and destroyed at the next. It is also the fade band: the
; gain ramps 1 -> 0 across max_distance..exit_distance (s28), so the hard
; cut-off happens where the lamp is already dark.
exit_distance=380
; The other half of the same hysteresis: the active set may grow to
; max_lights + sticky_extra before the farthest lamps are dropped.
sticky_extra=140
min_distance=0
; n04. The count has to cover the radius, and since n04 the cap may only trim
; the band BEYOND max_distance: a lamp strictly inside max_distance is never the
; one that gets dropped, whatever the count. 320+90 did not cover the map (408
; lamps within 300 units at the worst point, 552 within 380), which is why the
; 2026-11-12 10:22 log shows the active set jumping by +193/-193 and
; +136/+221/-357 handles while the player walked. 560+140 covers the whole 380-unit band (552 at the
; worst point), so no lamp in the streamed area is ever dropped. If fps
; matters more than steadiness, lower max_distance - not max_lights.
max_lights=560

; WHEN THE LAMPS ARE LIT. twilight = the sun's elevation, which is what a real
; photocell reads (it switches around civil twilight, sun about -6 degrees).
; hours = the old on_hour/off_hour window, kept for A/B. With twilight, on_hour
; and off_hour are ignored.
when=twilight
dusk_deg=-6
; dawn_deg is read, sanity-checked (it must stay above dusk_deg) and echoed in the
; log, but the current switching rule is stateless and only compares the sun against
; dusk_deg - the higher rising threshold would need the previous lamps-on state.
; Kept so an existing ini keeps loading unchanged.
dawn_deg=-4
on_hour=19
off_hour=6

; THE LUMINAIRE.
;
; One GTA SA game unit is about one metre. That is measured, not assumed: the
; traffic signal data puts a signal head 7.6 units above its road plane, and a
; real signal head hangs about 6 m up. So the old radius=15 was a THIRTY METRE
; glowing sphere - three quarters of a football pitch across for a lamp the size
; of a lunchbox. That is why the light pools read as shapeless haze and why
; turning volumetrics on produced a fog wall instead of shafts of light.
;
; fixture_size=1 (the default) replaces that with the real housing size: a
; cobra-head roadway luminaire is about 0.50 m x 0.25 m, so a 0.2 game unit
; sphere. Radiance is then multiplied by (radius_ref/radius)^2 so the lamp puts
; out exactly the same total light - which is the only reason the radius could
; be fixed at all. Shrink the sphere without that compensation and the street
; goes black, which is why it was never fixed before.
;
; If the smaller spheres turn out to sparkle or band in the path tracer, raise
; fixture_scale rather than going back to the blob: 5.0 gives a 1 m source,
; still fifteen times tighter than before and far gentler on Monte Carlo noise.
;
; Expect the night to read BRIGHTER at the same radiance, and lower
; radiance_scale to compensate. Flux preservation holds the nominal output equal,
; but a 15 m sphere centred on a lamp post has most of its surface inside the
; ground and the pole, and that light leaked away underground. A 0.2 m sphere
; above the housing puts all of the same flux where it can actually land.
fixture_size=1
fixture_scale=1.0
radius_ref=15
radius=15

; UsdLux coneAngleDegrees is the FULL angle of the shaping cone. With
; fixture_size=1 each size band gets its own distribution: 125 degrees for a
; roadway luminaire, 140 for a post-top pedestrian luminaire. The 70 the old
; profile used is a spotlight, which is why the pools read as hard circles.
; cone_angle/cone_softness below are only used when fixture_size=0.
cone_angle=120
cone_softness=0.5
sphere_shaping=1
focus_exponent=0

; Radiance per size band. These are calibrated at radius_ref above and are
; rescaled automatically if the fixture size changes. They are relative to each
; other and to the sun; radiance_scale is the one knob to move if the whole
; night is off.
radiance_big=2.0
radiance_middle=1.2
radiance_small=0.8
radiance_scale=1.0

; LAMP SPECTRA.
;
; lamp_cold / lamp_warm name a real lamp family and win over kelt_* when set.
; They exist because a street lamp is a gas discharge, and a gas discharge does
; not have a colour temperature in any sense that draws the right picture:
;
;   hps       high-pressure sodium. Nearly all its flux is the sodium D doublet
;             at 589.0/589.6 nm. It reads yellow-orange with essentially no blue
;             and almost nothing in the deep red. Its *correlated* temperature is
;             ~2000 K, but a 2000 K Planck curve puts a third of its energy below
;             650 nm, so kelt_warm=2000 makes sodium look like a dim incandescent
;             bulb. That is the bug this replaces.
;   mercury   mercury vapour. The 546.1 nm green line and the 435.8 nm blue line
;             dominate, so it reads blue-green with a magenta cast, not the
;             neutral 6500 K white a temperature dial gives you.
;   halide    metal halide: the only discharge source here with decent colour
;             rendering, near neutral.
;   led       blue pump line plus a broad phosphor continuum.
;   tungsten a genuine thermal source, so kelvin IS the right model for it.
;   neon      red-orange signage.
;
; San Andreas street lighting is sodium on the warm side and mercury or metal
; halide on the cool side. Odd lamp types are the cool family, even the warm.
; Set lamp_cold= and lamp_warm= empty to fall back to kelt_*, and kelt_*=0 to
; fall back to the hand-written triples.
lamp_warm=hps
lamp_cold=mercury
kelt_cold=5000
kelt_warm=2100
cold=0.85,0.90,1.00
warm=1.00,0.80,0.55

resync_frames=30
light_hash_base=0
destroy_delay_ms=500
block_gamma=1

; Cap on handles across every module. 0 = no cap, deliberately: with a cap the
; modules starve each other in proportion to nothing but request order, and a
; starved create used to be read as a bridge failure, which switched the whole
; street-light module off for the session. The bridge has never refused a light
; here (create_fail=0, draw_fail=0, no 'Remix API call failed' in bridge64.log).
max_total_lights=0

; The calibration probe. Off in production; turn it on with
; scripts/abtest-lights.sh probe on when the brightness question is open again.
probe=0
probe_x=2489.927
probe_y=-1655.956
probe_z=19.843
probe_radius=15
probe_radiance=2
probe_follow=1
probe_dz=2
probe_scale=1
probe_hash=900001
probe_shape=1
probe_cone=0
probe_sweep=0
probe_sweep_axis=0
probe_sweep_steps=4
probe_step_ms=4000
probe_refresh_ms=3000

; ---------------------------------------------------------------------------
; THE SUN. model=1 is real solar geometry: declination from the season, hour
; angle from the clock and the longitude, altitude/azimuth from the
; astronomical triangle, then brightness and colour from Beer-Lambert
; extinction along the Kasten-Young air mass. That is where a red sunset comes
; from - nobody tunes an orange colour, it falls out of the path length.
; Validated against USNO in tests/solar_check.cpp: sunrise 5:58 and sunset 20:05
; for Los Angeles on July 15, sunrise azimuth 63.7 degrees, declination to
; 0.16 degrees.
;
; model=0 is the original fixed-plane 360-degrees-per-day orbit, which is what
; spin/tilt/roll/fade_pow/min_elevation still drive.
[sun]
enabled=1
model=1
radiance=6.0
color=1.00,0.98,0.95
; The real sun and moon discs are 0.53 and 0.52 degrees. Remix uses this for
; penumbra softness, so the real number gives real shadow edges. Raise it for
; softer, less correct shadows.
angular_diameter=0.53
spin=0
tilt=0
roll=0
fade_pow=1
min_elevation=0.02
step_deg=1
volumetric=0
hash=7
; Los Santos is coastal Southern California. Latitude is the biggest single
; lever on where the sun ends up: at 34 degrees north the July sun reaches 77
; degrees altitude, at 45 it reaches 66.
latitude=34.05
longitude=-118.24
timezone=-8
; Los Angeles keeps summer time: dst=1 adds an hour between about March 11 and
; November 4 (day 70-307), so a July sunset lands near 20:05 game time, not 19:05.
dst=1
; 186 = mid-July, the season the story opens in. Used when track_date=0, and as
; the fallback when the in-game calendar does not look like a calendar.
day_of_year=186
track_date=1
; Pin the clock for lighting comparisons: -1 = let the game run its own clock.
; SA runs an in-game minute every 1.6 real seconds, so noon to sunset is twenty
; minutes of waiting; force_hour=20 gets you there now. Try 8, 13, 18, 20 and 2
; to see the whole day in five short runs.
force_hour=-1
force_minute=-1
; Aerosol extinction at 550 nm. 0.08 is clean mountain air, 0.12 is a ordinary
; day, 0.25+ is smog or haze - which Los Santos has. Higher turbidity reddens
; and dims the low sun further without touching it at noon.
turbidity=0.15

; ---------------------------------------------------------------------------
; THE TIME AXIS (s29). Everything above reads one number: the game's clock. These
; four knobs decide how much of that reading is trusted, and they are commented
; out because the values below ARE the defaults compiled into
; plugin/src/config.cpp - uncomment one only to A/B it. What the numbers are:
;   ms_per_game_minute    the seed for the tick calibration. The 2026-11-12 log's
;                         clock deltas measured a p50 of 2015 ms per game minute
;                         (SA's nominal rate is 1600); the plugin then calibrates
;                         against the ticks itself, so this is only the starting
;                         point and a wrong value costs one second of settling.
;   jitter_tolerance_min  a backwards clock move up to this many game minutes is
;                         read noise and is held against, not followed. The same
;                         log shows the clock bytes wobbling by minutes between
;                         reads; without this the sun walks back and forth.
;   reanchor_ms           a jump bigger than the tolerance (the log's worst was
;                         1372 game minutes, from a scripted setTimeOfDay) is
;                         followed, but only after this long of being stable, so
;                         one glitched read cannot move the sky.
;   calendar_stable_reads the in-game (month, day) is trusted after this many
;                         consecutive identical reads - one read per second, from
;                         the sky module. 0 = always use [sun] day_of_year.
; See plugin/src/tod.h for what each one protects against and
; .strata/notes-s29-time-of-day-smooth.md for the measurements.
;
;[clock]
;ms_per_game_minute=2000
;jitter_tolerance_min=8
;reanchor_ms=2000
;calendar_stable_reads=30

[moon]
enabled=1
radiance=0.10
color=0.78,0.85,1.00
angular_diameter=0.52
; 0 = new, 0.25 = first quarter, 0.5 = full, 0.75 = last quarter. The old code
; had no phase at all, so the moon was permanently full - one reason night read
; as bright and flat.
phase=0.5
fade_pow=1
min_elevation=0
step_deg=3
hash=8

; ---------------------------------------------------------------------------
; THE SKY LAYER. These are pushed into the renderer at runtime through
; SetConfigVariable, which is the only way to make the ambient follow the sun.
; rtx.conf is read once at startup and cannot express "skyBrightness 1.0 at noon
; and 0.02 at midnight".
[sky]
apply=1
; rtx.skyBrightness in full daylight. The install shipped 3, which raises the
; floor of every shadow so far that lamps cannot compete with it - the direct
; cause of "lights don't cast".
day=1.0
; ... and at night. Not 0: with a zero ambient, anything not in direct view of a
; lamp renders pure black and the denoiser has nothing to reconstruct from.
night=0.02
; Extra ambient from the moon, scaled by phase and altitude. A full moon at
; zenith lifts the night ambient; a new moon adds nothing.
moon=0.05
; The daylight ramp, in degrees of solar elevation. -10 to +4 covers real
; twilight: by -10 degrees the sky's illumination is effectively gone.
dusk_deg=-10
dawn_deg=4
; rtx.emissiveIntensity by day and by night. The install shipped a flat 10,
; which multiplies every emissive material in the 2174-file asset pack by ten
; and is the other half of the blown-out look. Equal day/night values keep the
; gain constant; different values make signs and tail lights read stronger at
; night, which is true both physically and perceptually.
; n12 (test-2026-11-12c V7): "some building windows are flat white blocks
; (overbright emissive) next to unlit ones". Measured on the 2026-11-12 frames
; with tools/frame_light_measure.py: 0.30-0.40 % of the ground band of every
; frame has ALL THREE channels at or above 235 - the tonemapper has clipped them -
; the biggest connected block is ~850-960 px (a window pane at this distance, so
; these are windows and not noise), and their chroma, max-min over the clipped
; pixels, is 1.7 out of 255 at mean RGB [252,252,252]. Neutral white with no
; texture in it: the emissive term alone is above the tonemapper's knee. A real
; lit window carries its lamp's spectrum (chroma 10-40 for the warm interiors the
; pack paints) and shows its mullions.
; This is the only dial the profile has: rtx.emissiveIntensity is a single global
; scale (rtx_scene_manager.cpp:1771 multiplies every material's emissive by it),
; and there is no per-texture emissive category in Remix 1.6.1 - the per-texture
; lists are geometry/material categories, not radiometry. Per-material control
; belongs in the asset pack's mat_<HASH> materials, which this task does not
; touch. Day is cut harder than night because that is where the measurement is:
; against a sunlit street an emissive window is out of range, against a night
; street it is the only light and reads correctly at nearly the authored value.
; Both are rate-limited on the way there (sky_rel_per_sec), so the change is a
; ramp and not a step.
emissive_day=0.5
emissive_night=0.8
; Extra "key = value" lines pushed once at startup, resolved next to the .asi.
settings=rhyremix-rtx.conf
; 1 = send the candidate rtx.* key list once and log which the runtime accepts.
; GENERAL_FAILURE means the key does not exist in this Remix build, so one run
; turns a list of guesses into a list of facts.
probe=0

; ---------------------------------------------------------------------------
; THE EXPOSURE ANCHOR (n22). n16 measured the tonemapper and shipped it: every
; profile now carries rtx.tonemappingMode = 0 (Global) and
; rtx.tonemap.exposureBias = -0.5. In Global mode the exposure of the WHOLE frame
; is one number, 2^(rtx.tonemap.exposureBias + userEVBias)
; (rtx_tone_mapping.cpp:234) - which is exactly what stops the daytime frame
; re-exposing per region, and exactly what makes it wrong at night, because
; rtx.conf is a file and the game clock is not. Measured on the shots the
; 2026-11-12 report called good (build/tmp/n16/good-before.json): noon p50 123-170
; with 0.3-1.8 % black, but 02 grove pools 21:00 p50 17.4 with 34.5 % black and 03
; sodium lamp closeup 21:00 p50 7.0 with 52.2 % black. A -0.5 EV anchor sized to
; pull p50 147 -> ~110 at noon takes a quarter of the light off a frame that
; already sits there. One static number cannot serve both ends of the day, so the
; plugin drives the same option from the SUN: the curve, the floors and the reason
; for every number below are in plugin/src/exposure.h, asserted in
; tests/exposure_check.cpp and (for the rate bound) tests/smooth_check.cpp.
;
; WHAT THIS DOES NOT TOUCH: rtx.userBrightness / rtx.userBrightnessEVRange. Those
; are the Remix UI's Brightness slider (the real option names are doubled,
; rtx.userBrightness.userBrightness, and they carry RtxOptionFlags::UserSetting),
; they live in user.conf, and user.conf sits ABOVE rtx.conf
; (rtx_option_layer.cpp:386-397) - a mod that writes them fights the player's
; slider for the same EV. rtx.tonemappingMode is not touched at runtime either:
; switching mode re-arms the whole local pyramid and changes the look
; discontinuously at the switch point.
;
; NOT YET MEASURED IN GAME: the night numbers below are the before side. Rule 1 of
; every task in this repo forbids running the game, and an exposure change only
; becomes a pixel once the runtime draws a frame, so the after side is owed by the
; next live run - docs/TARGET.md §6 has the protocol and docs/NEXT-TEST.md the
; commands. Undo is one line: apply=0 - with one caveat that belongs to the layer,
; not to the switch: SetConfigVariable writes the runtime's USER layer, which
; outranks rtx.conf and outlives the run, so after a run that pushed +0.5 the
; file's -0.5 does not return by itself. Run once with apply=1 at a noon stop (the
; plugin re-publishes -0.5 there) or set it with the Remix UI's Global Exposure
; control, which writes the same layer. tools/rtxprofile.sh restore restores
; rtx.conf, not this layer.
[tonemap]
; 0 = the plugin stops writing rtx.tonemap.exposureBias; on a fresh install
; rtx.conf's static -0.5 then stands for the whole day. This is the switch that
; undoes n22 (see the caveat above about a value an earlier run already wrote).
apply=1
; The anchor at full daylight. -0.5 is deliberately the SAME number the three
; profiles carry, so at noon the plugin publishes what rtx.conf already says: this
; change cannot move the daytime grade at all, and the noon numbers the next live
; run takes for n16 stay n16's numbers. Only the night end moves.
day_ev=-0.5
; ... and at night. +0.5 is a 1.0 EV swing = twice the light reaching a 21:00
; frame, inside the runtime's own span (the Remix UI's control is
; DragFloat("Global Exposure", -4, 4), rtx_tone_mapping.cpp:134). It is the number
; that stands in for what the local tonemapper used to do for free at night - and
; it is the number the live run is allowed to argue with: if the night shots come
; back blown, bring this to 0.0 before touching anything else.
night_ev=0.5
; The ramp runs on SOLAR ELEVATION, not on the clock: the same sky at dawn and at
; dusk gets the same EV, which is the point of the whole section (05:30 and 19:30
; are 14 hours apart on the dial and a few degrees apart in the sky). Same band as
; [sky] dusk_deg/dawn_deg so the ambient and the exposure agree about when it is
; twilight.
dusk_deg=-10
dawn_deg=4
; How fast the anchor may move, in EV per second. 0.05 means the full day/night
; swing takes >= 20 s. The sun alone never comes close (measured in
; tests/exposure_check.cpp: a whole game day at the real clock rate moves the
; anchor at <= 0.0004 EV/s), so this bound exists for the one thing that does step:
; the 2026-11-12 log recorded 104.5 degrees of sun elevation between two samples,
; and SARemix_Tour.lua pins the clock per stop. An unthrottled exposure change is
; the whole screen brightening in one frame - the pop n01/s28 exist to prevent.
; config.cpp/exposure.cpp clamp this to 0.005..0.25: a floor cannot be talked out
; of, same rule as [fade] in_ms >= 500.
max_ev_per_sec=0.05
; Hard clamp on the published value. -4..+4 is the span NVIDIA's own slider offers;
; anything outside is a black frame or a white one. day_ev and night_ev are
; clamped into these too.
min_ev=-4
max_ev=4

; ---------------------------------------------------------------------------
; TRAFFIC SIGNALS. A real signal is lit around the clock, so night_only=0 is the
; correct setting and costs handles; night_only=1 is the performance setting and
; switches on the same twilight the street lamps use.
[trafficlights]
enabled=1
list=rhyremix_traffic.txt
mode=cycle
; Where the heads come from. game = hook the corona the game itself registers for
; each signal head, so the light lands on the head (several metres out along the
; arm on a mast-arm signal) in the colour the game is showing. list = the pre-s01
; behaviour: one light per line of rhyremix_traffic.txt at the pole origin plus a
; headz guess, coloured by the local cycle. The plugin falls back to list by
; itself when the hook cannot be installed, and the log says which one is live.
source=game
; A head the game stops registering (it left the renderer, or that aspect is off)
; is marked stale after this long. n04 changed what staleness means: the game
; registers a signal corona from its renderer, so the registered set IS the
; camera frustum, and expiring on it used to fade every bulb and glow on a
; junction out 2 s after the player turned his back on it and create them again
; when he looked back (2026-11-12 10:22 run: expired=790, retired=817,
; steps=5669 in 970 s). A head now keeps its light, with the colour it last
; showed, while it is within exit_distance of the PLAYER, and is dropped only
; beyond it - so this is a staleness marker, not a destroy trigger.
head_ttl_ms=2000
; The 2DFX entry that gives the head position carries no direction, so by default
; the light sits exactly on the corona position. head_normal=1 moves it
; head_forward metres along the model's own "at" axis instead: an A/B knob, not a
; fix, because nothing says that axis is the lens normal.
head_normal=0
head_forward=0.15
; n02: how long the hook may be live without recording a head before the module is
; allowed to fall back to the list - and the fallback only happens when a signal of
; the loaded list is actually inside the game's own corona range. That range is 50.0
; m (the call site pushes 50.0 at 0x49DCF3 and the corona function tests it at
; 0x6FC22E, after our patch point), and the default spawn is 79.1 m from the nearest
; of the 1522 poles, so a session that starts signal-free keeps the hook instead of
; spending the whole run with the light on the mast. 0 = decide on the first frame.
; The decision, the distance and the counters are logged once: "head source = ...".
head_grace_ms=20000
; n02: 1 = put a list-mode light on the LENS: rotate the file's model-local head
; offset by the instance heading and add it to the instance origin, the same rule the
; game applies to a head offset at 0x59C890. For cj_traffic_light4 (720 of the 1522
; instances) that is 2.10 m sideways off the mast. 0 = the old pole position
; x,y,z+headz. Only a v2 rhyremix_traffic.txt (8 columns) carries those numbers; a v1
; 4-column file gives the same position either way.
lens_offset=1
period=60
; n04: 90 + sticky_extra 120 covers the worst case measured over the 1522-entry
; signal list (85 signals within 250 units of a point, 150 within 300), and the
; cap may only trim beyond max_distance anyway.
max_lights=90
max_distance=250
exit_distance=300
; Radiance is baked at CreateLight, so a phase change costs a destroy plus a
; create. Doing that for every light in a 250 unit radius is a signal that
; visibly blinks across a whole district for a colour change nobody can read at
; that distance. Only lights inside phase_near get re-coloured.
phase_near=150
; A traffic signal module lens is 200 mm across, so the emitting sphere is 0.1
; game units in radius. The radius=6 below was a six metre ball - wider than the
; intersection it is meant to be a point on; it only applies with fixture_size=0.
radius=6
radius_ref=6
night_only=0
radiance=1.5
resync_frames=30
; s30: the bulb. With fixture_size=1 (the default) a signal is a small bright
; light at the lens: bulb_radius=0 means "the real lens size from lamps.h" (0.10
; m, times fixture_scale), and bulb_radiance is the lens luminance IN NITS at
; that radius - no (radius_ref/radius)^2. That multiplier is right for a street
; luminaire (its 15 m sphere was a brightness dial) and wrong for a signal: at
; 0.10 m it turned radiance=1.5 into 5400 nits, the whole output of a six-metre
; blob squeezed into a marble, and sixty of those lit a street green instead of
; showing sixty small heads. bulb_radiance=0 turns the signal lights off.
bulb_radius=0
bulb_radiance=1200
; n02b: the GLOW. rhY 2026-11-12 08:50: "We wanted the glow from the traffic
; light and the bulb. It should be both like real life." A lit signal now gets
; TWO lights at the same lens, same colour, same phase, one fade envelope: the
; bulb above, and a soft sphere of glow_radius metres carrying glow_flux.
; Both numbers are measured, not picked. glow_flux=304 is the flux our own
; signal light put out in the 2026-11-12 00:48 run (5400 nits over a 0.10 m
; sphere: 4*pi*r^2*mean = 304) - that is the glow rhY saw and wants kept - and
; it is now spread over a 3 m sphere instead of squeezed into the lens, so it
; colours the pole, the wall, the road and the peds a few metres around the
; head, strongest at the head. config.cpp caps glow_flux at 3473, one mid street
; luminaire's flux (rhyLuminaireFlux() reproduces it from radiance_big=2.0,
; radius_ref=15 and the shipped 2100 K / 5000 K lamp colours): a signal that
; out-lights the lamp over its head is the same defect in a new colour. 304 is
; 8.8% of that, so the reference strength needs no take-down. glow_flux=0 =
; bulb only (the A/B switch); glow_radius is the spill distance.
glow_radius=3
glow_flux=304
; s30: the game registers its OWN corona for every lit head at radius 15.0 - a
; 30 m additive green flare per head, which the Remix bridge renders as emissive
; geometry. That is the flood the screenshots show (10-39% of a signal-stop
; frame saturated green, and not one green pixel bright enough to read as a
; bulb). This is the radius we leave it: a lens-sized bulb. 0 = do not touch the
; game's corona at all (only the hook patch is then written). The ambient that
; flare used to throw over the street is the glow light above now - ours, a few
; metres wide, cycling with the bulb - not a 30 m sprite.
corona_radius=0.45
; The three lens colours are not configurable here on purpose: they are the
; passbands of real signal glass, integrated across the visible spectrum, and
; hand-picking them is how you end up with a red that is really orange.

; ---------------------------------------------------------------------------
; NOTHING MAY CHANGE INSTANTLY (s28, n01). Remix bakes a light's radiance and a
; distant light's direction at CreateLight time, so every lighting change this
; plugin makes is a sequence of destroy+create pairs: the ramp length, the size
; of one step and how many creates one frame may spend are the three numbers that
; decide whether a change reads as a fade or as a pop. They are commented out
; because the values below ARE the defaults compiled into plugin/src/config.cpp.
; The evidence for each is .strata/notes-s28-lighting-no-pops.md and
; .strata/notes-n01-lighting-no-pops-renderer.md; the bounds are asserted in
; tests/smooth_check.cpp and tests/handle_check.cpp.
;
;[fade]
; A lamp's gain ramps up over this long when it enters the active set, and down
; when it leaves. config.cpp clamps both to >= 500 ms: a faster switch is what
; the 2026-11-12 log recorded as 320 handles appearing, or vanishing, 20 times in
; 25 minutes.
;in_ms=700
;out_ms=900
; The largest gain change one handle may carry, as a fraction. 0.25 means a lamp
; never appears at more than a quarter of its radiance in one create.
;step=0.25
; Per-frame CreateLight budget across every module. A fade IS a sequence of
; creates, so this is what spreads a whole layer over frames instead of one burst
; that changes the whole world's lighting at once. 0 = no per-frame limit.
;creates_per_frame=24
; When the player ped pointer reads 0 (teleport, cutscene, respawn) the last known
; position is held this long and the lamp layers are faded out rather than
; destroyed. The 2026-11-12 log had the pointer at 0 for 13 seconds.
;player_grace_ms=8000
; rtx.skyBrightness / rtx.emissiveIntensity may move by at most this multiplicative
; rate per second, plus this absolute allowance per second so the 0.02 night floor
; can still move. The log's ambient stepped 0.02 -> 1.00 in one sample, nine times.
;sky_rel_per_sec=3.0
;sky_abs_per_sec=0.25
; The same two limits for the sun/moon radiance and direction. 12 deg/s is the
; direction slew: the log's worst single-sample sun-elevation step was 104.5 deg,
; which at 12 deg/s becomes a nine second walk instead of one frame.
;sun_rel_per_sec=3.0
;sun_deg_per_sec=12.0
; n01 (s29 note T7): WHEN the sun/moon handle is replaced. A distant light's
; direction is baked, so a moving sun is a sequence of rebuilds, and the old rule
; - rebuild once the handle is [sun] step_deg (1 deg, twice the sun's 0.53 deg
; disc) out of date - fires exactly when the error has grown to the whole
; threshold, at a period that follows the body's rate. The cadence replaces the
; trigger with a clock: rebuild every handle_cadence_ms, shortened only as far as
; needed that no rebuild carries more than handle_step_deg of direction or
; handle_rel_lum of luminance, and never below handle_cadence_min_ms (the bridge
; churn floor: two bodies at the floor is 13.3 creates/s, against the 2.43/s of
; lamp traffic the 2026-11-12 log measured). handle_step_deg=0 falls back to the
; body's own [sun]/[moon] step_deg as the budget.
;handle_cadence_ms=2000
;handle_cadence_min_ms=150
;handle_step_deg=0.5
;handle_rel_lum=0.05
; A signal colour change cross-fades over this long between the two hashes. 0 =
; instant, which is what a real signal is; the light's appearance and
; disappearance always use in_ms/out_ms instead.
;phase_fade_ms=250

; ---------------------------------------------------------------------------
; SHUTTING DOWN (n09). On 2026-11-12 10:39 rhY quit from the menu: NvRemixBridge.exe
; exited, the window disappeared, and gta-sa.exe then sat there for two minutes with
; its main thread spinning in user space while the plugin kept drawing 302 street
; lights and 4 signal lights, every frame, into a bridge client whose server process
; was already gone - and printed nothing about any of it, because the plugin had no
; DLL_PROCESS_DETACH and no idea the process was ending. The numbers below are how
; long each signal has to HOLD before the bridge is declared gone; the rules and why
; each one needs a window at all are in plugin/src/shutdown.h, asserted in
; tests/shutdown_check.cpp, and the timeline is .strata/notes-n09-exit-hang.md.
; They are commented out because the values below ARE the defaults compiled into
; plugin/src/config.cpp. 0 means "one frame is enough" - do not use it on
; present_ms or device_ms, which is what alt-tab looks like.
;
;[shutdown]
; The Present we forward to has been failing this long. One failed frame is a mode
; change; a second and a half of them is a device that is not coming back.
;present_ms=1500
; TestCooperativeLevel (polled at most once a second, and only once something else
; already looks wrong) has said the device is gone this long. Alt-tab says lost too,
; which is why this window is the longest of the three.
;device_ms=3000
; The window the device was created with (IDirect3DDevice9::GetCreationParameters,
; read once at hook install - the game hands Present no HWND) has stopped being a
; window. Quit destroys it, so this is the earliest and cheapest signal.
;window_ms=750
; Our own CreateLight/DrawLightInstance failures have been climbing this long AND
; another signal is on. Alone, that pattern is one light the Remix server refuses -
; which is a streetlights.cpp problem (g_apiBroken), not a dead bridge.
;calls_ms=4000
; How often the "shutdown: still running N ms after the bridge went away" line is
; repeated while the process refuses to die.
;log_ms=5000
; 0 = always forward Present to the bridge client (the shipped behaviour). >0 = once
; the bridge has been gone this long, stop calling it and return D3D_OK. This is the
; A/B switch that answers where the 2026-11-12 spin actually was: if the game exits
; with it set, the spin was inside the bridge client's Present; if it still hangs,
; the spin is in the game's own device-reset loop and no ASI can reach it.
;stop_present_after_ms=0

; ---------------------------------------------------------------------------
; THE CAR'S OWN LIGHTS (n12, test-2026-11-12c V5). "Tail lights throw large red blobs on
; the sand (too wide/strong for 2 small bulbs); headlights a small weak pool." Both halves
; are one cause: the only light sources a car has in this scene are the game's corona
; sprites, and every corona the game registers for a vehicle is radius 15.0 game units - a
; 30 m wide additive billboard per bulb. The runtime renders those as emissive geometry
; (rtx_instance_manager.cpp:1132) and, with rtx.enableSeparateUnorderedApproximations, that
; emissive geometry also lights the surroundings: a 4 cm tail bulb reaches the renderer as a
; 30 m red ball, and the front of the car has nothing at all because the game's headlight
; beam sprite (coronaheadlightline) is in rtx.ignoreTextures - removed from the raytraced
; scene, so no light comes with it. Hence "small weak pool".
;
; The module reads the game's corona store (0xC3E058, 64 entries of 0x3C, count at 0xC3E038
; - read-only, page-validated, nothing patched), pairs the dummies of one vehicle, and adds
; our own lights sized to the real lamps: a 0.09 m reflector in a 50-degree beam aimed along
; the car's own front-to-rear axis, and 0.05 m red lenses at the rear. The layout, the call
; sites it was measured from and the radiometry are in plugin/src/vehiclelights.h; the
; assertions are tests/vehicle_lights_check.cpp; the measurements are
; .strata/notes-n12-vehicle-lights-particles.md.
;
; Every value below IS the compiled default, so the section is commented out.
;
;[vehiclelights]
; The whole module. 0 = no vehicle lights at all.
;enabled=1
; Cap on live vehicle lamps, nearest vehicle first. 24 = six cars' worth; the corona store
; itself holds 64 entries, and the per-frame create budget bounds the churn on top.
;max_lights=24
; Metres. A vehicle further away than this gets no light; between 0.6x and 1x of it the
; lamp fades out (rhyDistanceGain), so there is no hard edge (s28 finding 1).
;max_distance=90
; The lamps of one vehicle have to fit inside this box, in metres. What it is for: the
; corona store is shared with street 2dFx, and without it a red shopfront 10 m from a parked
; car's headlamp corona becomes that car's tail lamp.
;max_spread=6.0
; Flux in the plugin's own units - the ones rhyLuminaireFlux defines, where one street
; luminaire is 3473 of them with the shipped ini (about 5 real lumens each).
; A low beam is 1000-1200 lm but puts them into a ~50 degree beam whose peak intensity is
; 20 000-30 000 cd, about ten times a street luminaire's. The runtime's cone is a MASK, not
; a concentrator (light_shaping.slangh multiplies the contribution by a 0..1 factor and
; nothing renormalizes), so rhyBeamConcentrationGain raises the radiance by 2/(1-cos 25deg)
; = 21.3 and the number here is the beam-equivalent flux, not the bulb's catalogue lumens.
; 950 puts ~5000 of peak intensity on the road - against the 868 of a street luminaire.
;head_flux=950
; A rear position lamp is 2-20 cd and a brake lamp 60-300 cd, unshaped: 20 and 100 flux
; units, i.e. ~25 and ~125 cd of peak intensity. A tail lamp is 1/170 of the street lamp
; over its head, which is the "too strong" half of V5 fixed in the other direction.
;tail_flux=20
;brake_flux=100
; Emitting sphere radii in metres; 0 = the fixture (0.09 headlamp reflector, 0.05 tail lens).
;head_radius=0
;tail_radius=0
; Beam cone, HALF angle in degrees - rtx_remix_api.cpp:544 takes cos(DegToRad()), and the
; street lamps' cone_angle=120 is a 240-degree flood, which is only sensible for a luminaire
; aimed at the road. 25 here is the 50-degree spread the task asks for. -1 for
; head_cone_softness means "use the fixture's 0.35".
;head_cone_deg=0
;head_cone_softness=-1
; The game writes the 2dFx colour per light state (0x53B710 reads the three bytes at
; 0x8CCFF0 the vehicle code fills), so a brighter red is the only brake signal the corona
; store carries. 0 = never call a tail lamp a brake lamp.
;brake_red_min=220
; A Remix light's position, direction and radiance are baked at CreateLight, so a moving car
; means re-created lamps. A lamp is rebuilt when it has drifted this many metres, or turned
; more than 10 degrees, or changed filament - and never more often than cadence_ms. At
; 100 km/h that is at most ~8 creates per second per lamp, and the [fade]
; creates_per_frame budget bounds it again.
;move_step=0.8
;cadence_ms=120
