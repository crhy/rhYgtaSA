# SARemix_Shot.conf - in-game screenshot hotkey (installed next to the .lua).
#
#   key      VK code of the key that asks for a screenshot.
#            123 = F12, 122 = F11, 121 = F10, 113 = Ctrl (avoid: the game
#            already uses Ctrl+PrintScreen, which crashes the bridge).
#   enabled  0 turns the hotkey off without removing the script.
#   cooldown seconds before a second trigger counts (spam guard).
#
# The marker lands in <game>/screenshots/pending/ and scripts/shot-watch.sh
# (started by launch-rtx.sh) turns it into a window grab under
# <game>/screenshots/shots/.
key=123
enabled=1
cooldown=0.4
