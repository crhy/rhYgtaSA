# Renderer settings pushed into RTX Remix at RUNTIME, through
# remixapi_SetConfigVariable (plugin/src/rtxconf.cpp).
#
# ---------------------------------------------------------------------------
# THIS FILE IS DELIBERATELY NEARLY EMPTY. READ THIS BEFORE ADDING TO IT.
# ---------------------------------------------------------------------------
#
# On 2026-11-11 a run pushed 60 candidate settings at startup through this
# mechanism. The game showed a white first frame, never got past the intro, and
# about seventy seconds later the bridge server died with a C++ exception
# (0xe06d7363). The build before it had run eight minutes and reached gameplay.
#
# Two facts came out of that, and both are load-bearing:
#
# 1. SetConfigVariable's return code does not validate the key. The client
#    returned SUCCESS for all 60. The server logged
#        warn: [RTX Option]: 'rtx.userBrightness' is not an RtxOption or a key
#              in a registered dynamic namespace.
#    for twelve of them. So "the call succeeded" means "the name parsed", and
#    scripts/check-rtx-probe.sh exists to cross-reference the two logs.
#
# 2. Keys that reconfigure a renderer SUBSYSTEM - quality preset, raytracing
#    mode, upscaler, ray reconstruction, neural radiance cache training, the
#    volumetric subsystem, view distance, culling - are startup options. They
#    belong in rtx.conf, which is read before the first frame exists. plugin/src/
#    rtxconf.cpp refuses them by name (rhyRtxKeyIsUnsafe) so a typo in this file
#    cannot bring the bridge down again.
#
# So: everything static lives in config/rtx.conf, which deploy.sh installs.
# What is left here is only what genuinely has to change while the game is
# running, and that is exactly two settings - which plugin/src/sun.cpp pushes by
# itself every second, following the sun. They are listed below as comments so
# the shape of the file is obvious.
#
# Confirmed settable at runtime on Remix 1.6.1 (no server warning), safe to use
# here if you want to experiment:
#
#     rtx.autoExposure.enabled = True
#     rtx.autoExposure.evMinValue = -4
#     rtx.autoExposure.evMaxValue = 4
#     rtx.autoExposure.autoExposureSpeed = 1.0
#     rtx.localtonemap.shadows = 1.0
#     rtx.localtonemap.highlights = 1.0
#     rtx.localtonemap.exposure = 1.0
#     rtx.localtonemap.boostLocalContrast = False
#     rtx.tonemap.finalizeWithACES = True
#     rtx.tonemap.toneCurveMinStops = -6
#     rtx.tonemap.toneCurveMaxStops = 6
#     rtx.tonemap.colorGradingEnabled = False
#     rtx.enableDirectLighting = True
#     rtx.enableSecondaryBounces = True
#     rtx.fallbackLightRadiance = 0
#     rtx.fallbackLightRadius = 3
#     rtx.fallbackLightType = 1
#     rtx.ignoreGameDirectionalLights = True
#     rtx.uniqueObjectDistance = 1000
#     rtx.pathMaxBounces = 3
#     rtx.pathMinBounces = 1
#     rtx.usePostFilter = False
#     rtx.postFilterThreshold = 10
#     rtx.di.enableDenoiserConfidence = False
#     rtx.di.permutationSamplingNthFrame = 1
#     rtx.restirGI.useSampleStealing = 1
#     rtx.restirGI.useVirtualSample = False
#     rtx.neeCache.enableModeAfterFirstBounce = 2
#     rtx.shadowTerminator.enableOffset = True
#     rtx.shadowTerminator.maxLength = 0.05
#
# Rejected by the server as not settable at runtime - put these in rtx.conf:
#
#     rtx.autoExposure.averageMode
#     rtx.userBrightness
#     rtx.userBrightnessEVRange
#     rtx.localtonemap.contrast
#     rtx.localtonemap.saturation
#     rtx.tonemap.enableHighlightRecovery
#     rtx.enablePrimaryShadows
#     rtx.enableVolumetricLighting
#     rtx.volumetrics.transmittanceMeasurementDistance
#     rtx.neuralRadianceCache.enableFog
#     rtx.dlss.dlssPreset
#     rtx.shadowTerminator.enable
#
# Refused by the plugin itself, because they took the bridge down once:
#
#     rtx.graphicsPreset, rtx.raytraceModePreset, rtx.qualityDLSS,
#     rtx.dlss.dlssPreset, rtx.enableRayReconstruction, rtx.enableCulling,
#     rtx.russianRouletteMode, rtx.enableVolumetricLighting, rtx.volumetrics.*,
#     rtx.neuralRadianceCache.*, rtx.shadowTerminator.enable,
#     rtx.viewDistance.distanceMode, rtx.skyProbeSide, rtx.skyForceHDR,
#     rtx.ignoreLights
#
# ---------------------------------------------------------------------------
# The two settings the sky module owns. Shown commented because sun.cpp writes
# them; putting values here would only fight with it.
#
#     rtx.skyBrightness       1.0 at noon down to 0.02 at midnight, plus a term
#                             for the moon's phase and altitude. rtx.conf cannot
#                             express a value that changes with the clock, which
#                             is the entire reason this mechanism exists.
#     rtx.emissiveIntensity   follows the same ramp, so signs and tail lights
#                             read stronger at night.
