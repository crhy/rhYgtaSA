; Test profile, and the bisect ladder for "the plugin says the lights are active
; but the screenshot shows nothing".  deploy.sh --test copies this over
; <game>\scripts\rhyremix.ini.
;
; ONE VARIABLE AT A TIME.  This profile used to start with the smallest light setup
; that can answer the question: the probe (1 point light) plus the moon (1 distant
; light), streetlights and traffic lights OFF.  They are ON now, at the values
; that were measured to work, and scripts/abtest-lights.sh <lights|sun|probe> off
; walks back down the ladder one step at a time without rebuilding:
;
;   1. probe only        -> does a point light reach the screen at all?
;   2. + moon            -> do distant lights reach the screen? (separate path)
;   3. + streetlights    -> 180 point lights: does the count break it?
;   4. + trafficlights   -> does the destroy/recreate cycle break it?
;
; WHAT THE LOG LINES MEAN (rhyremix.log, one per second):
;   remix: live=N create_fail=N draw_fail=N budget_refused=N
;     live          handles the bridge still holds for us
;     draw_fail     climbs while live stays flat => the bridge handed us handles
;                   for lights the Remix server never accepted. The reason is in
;                   rtx-remix/logs/bridge64.log, NOT in rhyremix.log.
;   streetlights: N active, M drawn this frame ... | remix: live=... 
;     "active" is our bookkeeping. "drawn" is what the bridge took. If active>0
;     and drawn==0, the lights exist in the plugin and nowhere else.
;
; UNITS.  rtx.conf sets rtx.sceneScale = 0.01, so 1 GTA SA game unit = 1 cm in
; the Remix world.  The lamp lists are in game units, and the game's own .ide
; files say what a lamp is: lamppost3's head sits 3.71 units above its base and
; lamppost2's 5.5, a Vegas pole 11.75, a street traffic light head 7.6 (the .ide
; radius field is in centimetres, so lamppost3 is 62 cm wide).  radius=15 is a
; 15 unit pool around a ~4 unit pole, which is what a street lamp should light.
; Radiance falls off with the square of that distance, so values around 1 are the
; right order of magnitude -- 200 or 400 floods the whole scene, which is what
; made the earlier build look "too bright everywhere".
;
; CALIBRATING THE PROBE.  Stand somewhere you can see (it follows the player by
; default, 2 units above the head, so it cannot be "somewhere else").  If it is
; invisible, the sweep walks radiance through x1, x10, x100, x1000 over 4 steps
; of 4 s each -- one run brackets the visible order of magnitude.  probe_scale
; answers the coordinate-space question (1 = game units like the lamp list,
; 0.01 = Remix metres per rtx.sceneScale).  probe_cone=0 keeps it an unshaped
; sphere so the cone is not a second suspect.  probe_hash is non-zero because
; every light that has ever worked here carries a non-zero hash.  Copy the winning
; numbers into radius and radiance_* and set probe=0.
[streetlights]
enabled=1
list=rhyremix_lights.txt
max_distance=300
; Two radii, and the gap between them is the anti-flicker.  A lamp the player
; has never had a light for gets one inside max_distance; a lamp that ALREADY
; has one keeps it out to exit_distance.  With a single radius, a lamp sitting
; on the boundary is created at one re-selection and destroyed at the next,
; which is a street light blinking while you walk past it.
exit_distance=380
; The other half of the same hysteresis: the active set is allowed to grow to
; max_lights + sticky_extra before the farthest lamps are dropped, instead of
; churning at exactly max_lights.
sticky_extra=140
min_distance=0
; THE COUNT HAS TO COVER THE RADIUS, OR THE CAP ITSELF BLINKS.  Selection is
; nearest-first, so a cap smaller than the number of lamps inside the radius
; evicts lamps that are already lit; they come back on the next pass, and that
; is a street light blinking too.  Measured over the WHOLE 7002-lamp list, not
; around one street: within 300 units of a lamp the count is 149 at the median
; and 408 at the worst point on the map; within 380 units it is 234 / 552.  The
; old 320+90=410 therefore did NOT cover the map, and the 2026-11-12 10:22 log
; shows the active set jumping +193/-193 and +136/+221/-357 handles while the
; player walked.  n04 fixed the rule (a lamp strictly inside max_distance is
; never the one the cap drops) and raised the count to 560+140=700, which covers
; the 552-lamp worst case inside exit_distance, so nothing in the streamed area is
; dropped at all.  If the frame
; rate suffers (MangoHud is on), lower max_distance and exit_distance together,
; not max_lights alone -- cutting the count while keeping the radius is what
; starved the old build, and 60 lights cut the world dark at roughly 140 units.
max_lights=560

; n11: the lamp HEAD (the bulb), a second small unshaped light at every bulb --
; the "no lit bulb" half of rhY's 2026-11-12c V2. head_radiance is nits at the
; head's own radius (NOT flux-preserved: see the production ini and lamps.h). The
; layer is near-field, so it has its own radius pair and its own cap; measured
; worst case within 120 units on the 8962-light 2dFx list is 174. head_glow=0 is
; the A/B back to one light per lamp.
head_glow=1
head_distance=120
head_exit_distance=160
head_max_lights=200
head_radiance=1200
head_scale=1.0
on_hour=0
off_hour=23
radius=15
cone_angle=70
cone_softness=0.4
sphere_shaping=1
focus_exponent=0
radiance_big=2
radiance_middle=1.2
radiance_small=0.8
radiance_scale=1.0
cold=0.85,0.90,1.00
warm=1.00,0.80,0.55
resync_frames=30
light_hash_base=0
destroy_delay_ms=500
block_gamma=1
; NOTE ON LAYOUT.  The plugin reads every key that is not under [sun], [moon] or
; [trafficlights] from the [streetlights] section, so the cap and probe keys below
; live inside it on purpose.  Moving them under a [general] header would make them
; silently stop applying (the defaults would win), which is the kind of thing that
; reads as "the knob does nothing".
; Cap on how many handles the plugin keeps alive at once, across every module.
; 0 = no cap, and that is the default on purpose: with a cap set the modules
; starve each other in proportion to nothing but the order they run in, and a
; starved create used to be read as a bridge failure, which switched the whole
; street-light module off for the rest of the session (that is what made the
; lights go out and stay out).  The bridge has never refused a light here
; (create_fail=0 draw_fail=0 in rhyremix.log, no 'Remix API call failed' in
; bridge64.log), so the per-module caps above are the real limits.
max_total_lights=0
probe=1
probe_x=2489.927
probe_y=-1655.956
probe_z=19.843
probe_radius=15
probe_radiance=2
probe_follow=1
probe_dz=2
probe_scale=1
probe_hash=900001
# probe_shape: which light type the bridge accepts is unknown; the distant light
# (sun/moon) is the only type proven to work here.  0 = bare LightInfo with no
# EXT chain, 1 = sphere (what the lamp lights use), 2 = disk facing down, 3 =
# vertical cylinder.  One run per value, nothing else changed: whichever one
# shows up names the type to use for every lamp light.
probe_shape=1
probe_cone=0
probe_sweep=1
probe_sweep_axis=0
probe_sweep_steps=4
probe_step_ms=4000
probe_refresh_ms=3000

; The sun and the moon are Remix distant lights driven from the game clock
; (plugin/src/sun.cpp).  They replace SARemix_Sun.lua, which moves game objects
; instead.  radiance is the value at the zenith; fade_pow=1 makes it fall off
; linearly with altitude, so dawn and dusk come out of the geometry, not a table.
; The moon is rung 2 of the ladder: a distant light is a different code path from
; the probe's point light, so if the probe shows and the moon does not, the fault
; is in the distant-light parameters, not in the bridge.
; Turn them off for the A/B with: scripts/abtest-lights.sh sun off
[sun]
enabled=1
radiance=6
color=1.00,0.98,0.95
angular_diameter=3
spin=0
tilt=0
roll=0
fade_pow=1
min_elevation=0.02
step_deg=2
volumetric=0
hash=7

[moon]
enabled=1
radiance=0.12
color=0.55,0.65,1.00
angular_diameter=1.5
fade_pow=1
min_elevation=0
step_deg=3
hash=8

[trafficlights]
enabled=1
list=rhyremix_traffic.txt
mode=cycle
; game = the s01 hook on the game's own corona call (0x49DD4C): head position and
; head colour straight from the game. list = the pre-s01 pole-position mode.
source=game
head_ttl_ms=2000
head_normal=0
head_forward=0.15
; n02: the head-source grace is range-aware - the module only falls back to the list
; when a signal of the loaded list is inside the game's own 50.0 m corona range (the
; default spawn is 79.1 m from the nearest pole, so it does not). See the
; "head source = ..." log line and .strata/notes-n02-signal-bulbs-at-the-lens.md.
head_grace_ms=20000
; n02: 1 = a list-mode light goes on the lens (the file's model-local head offset,
; rotated by the instance heading), 0 = the old pole x,y,z+headz. Needs a v2
; rhyremix_traffic.txt; a v1 file is identical either way.
lens_offset=1
period=60
; n04: 90 covers the worst case over the 1522-entry signal list (85 signals within
; 250 units of a point, 150 within 300), and the cap may only trim beyond
; max_distance anyway.
max_lights=90
max_distance=250
; Same two-radius hysteresis as the street lamps (see max_distance above).
exit_distance=300
; Radiance is baked at CreateLight, so a phase change costs a destroy plus a
; create. Doing that for every light in a 250 unit radius is a traffic light
; that visibly blinks across a whole district, for a colour change nobody can
; read at that distance. Only lights inside phase_near get re-coloured.
phase_near=150
radius=6
night_only=0
radiance=1.5
resync_frames=30
; s30: the bulb. fixture_size=1 (default) makes a signal a small bright light at
; the lens: bulb_radius=0 = the real 0.10 m lens from lamps.h, and bulb_radiance
; is the lens luminance in NITS at that radius, with no (radius_ref/radius)^2 -
; that flux-preserving multiplier is what turned radiance=1.5 into 5400 nits at
; 0.10 m and lit whole streets green. corona_radius resizes the game's own
; 15.0-unit (30 m) green flare per head down to a lens-sized bulb; 0 leaves the
; game's code alone. See .strata/notes-s30-signal-bulbs.md.
bulb_radius=0
bulb_radiance=1200
; n02b: the glow, the other half of rhY's "both like real life". A lit signal gets
; a second light at the same lens: glow_radius metres of soft sphere carrying
; glow_flux. 304 is the flux our signal light had on 2026-11-12 00:48 (the glow
; rhY wants kept), capped by config.cpp at 3473 = one street luminaire. Both
; lights share the phase, the colour and the fade, so they switch together.
; glow_flux=0 = bulb only.
glow_radius=3
glow_flux=304
corona_radius=0.45

; s28: the anti-pop floors, shared by both light modules and the sky layer. A Remix
; light's radiance is fixed at CreateLight time, so a fade is a SEQUENCE of creates;
; these are what keep that sequence from being one frame. The numbers are the shipped
; defaults and are asserted by tests/smooth_check.cpp (run by scripts/check-all.sh):
; with them, a whole 320-lamp street switching on moves the world's total lit output
; by at most ~2% per frame and takes about a second.
;   in_ms / out_ms      how long a lamp takes to come up / go down (never under 500)
;   step                largest brightness change one light may carry (0.05..0.5)
;   creates_per_frame   handle changes one frame may spend; destroys count too.
;                       0 = unlimited, which is exactly the burst that caused the pops.
;   player_grace_ms     hold the last player position this long when the game's ped
;                       pointer reads 0 (it did for 13 s at 01:09:20), THEN fade the
;                       layers out instead of destroying every light in one frame
;   sky_rel_per_sec     max rate for rtx.skyBrightness / rtx.emissiveIntensity
;                       (the measured step was 0.02 -> 1.00, a 50x ambient jump)
;   sun_rel_per_sec     same for the sun/moon radiance
;   sun_deg_per_sec     max angular rate for the sun/moon direction (the computed
;                       elevation stepped 104.5 deg between two samples)
;   phase_fade_ms       signal colour cross-fade. A real signal changes instantly and
;                       the total output is held constant across the cross-fade, so
;                       this one is allowed below 500 ms; 0 = instant.
[fade]
in_ms=700
out_ms=900
step=0.25
creates_per_frame=24
player_grace_ms=8000
sky_rel_per_sec=3.0
sky_abs_per_sec=0.25
sun_rel_per_sec=3.0
sun_deg_per_sec=12.0
phase_fade_ms=250
